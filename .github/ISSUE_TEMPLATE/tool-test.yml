name: 工具实测投稿
description: 提交一个教程在一个工具上的真实结果
title: "[工具实测] 文章标题 / 工具"
body:
  - type: input
    id: article
    attributes:
      label: 文章网址
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: 工具 slug、客户端版本与模型
      description: slug 使用 doubao、doubao-work、workbuddy、zhiban、codex 或 deepseek；普通聊天和技能导入分开记录。页面未显示的版本请写未显示，不猜测。
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: 实测日期
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 输入材料、步骤、结果和失败后如何修改
      description: 写清测试次数、成功次数、实际费用。请使用虚构材料并删除密钥。
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 真实截图
      description: 请上传导入、调用、结果截图，按工具-步骤命名，例如 doubao-work-01-import.webp。不要上传示意图。
    validations:
      required: true
